databases:
  - name: work-engineering-db
    databaseName: wep
    user: wep
    plan: free

services:
  - type: web
    name: work-engineering-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: work-engineering-db
          property: connectionString
      - key: SYSTEM_DATABASE_URL
        fromDatabase:
          name: work-engineering-db
          property: connectionString
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      # Requests from the static frontend arrive same-origin through this
      # service's own /api/* rewrite (see the routes block below), so this is
      # a defensive addition, not the fix for the demo/bootstrap 500 — but a
      # direct browser call against work-engineering-api.onrender.com (e.g.
      # hitting /docs) is genuinely cross-origin and needs this.
      - key: ALLOWED_ORIGINS
        value: '["https://work-engineering.onrender.com","https://work-engineering-api.onrender.com"]'

  - type: web
    name: work-engineering
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://work-engineering-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
