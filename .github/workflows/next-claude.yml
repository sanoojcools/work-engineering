name: Next Claude slice

# anthropics/claude-code-action rejects event=push. Use the CLI instead.
on:
  push:
    branches: [main]
    paths: [docs/NEXT.md]
  workflow_dispatch:

concurrency:
  group: next-claude
  cancel-in-progress: true

jobs:
  claude:
    if: vars.AUTO_SLICES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Execute docs/NEXT.md Claude section
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: claude-ci
          GIT_AUTHOR_EMAIL: claude-ci@users.noreply.github.com
          GIT_COMMITTER_NAME: claude-ci
          GIT_COMMITTER_EMAIL: claude-ci@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name claude-ci
          git config user.email claude-ci@users.noreply.github.com
          claude -p "$(cat <<'EOF'
          You are Claude on sanoojcools/work-engineering.
          Read CLAUDE.md then docs/NEXT.md.
          Execute ONLY the Claude section. If LOCKED, print BLOCKED and exit 0.
          Follow docs/contracts named there. One branch claude/…, one PR to main.
          Do not merge. Do not edit frontend Census/Chart/Plan. HONESTY.md paragraph.
          Stop when the PR is open.
          EOF
          )" --dangerously-skip-permissions --print
