name: Automerge agent PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, unlabeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  automerge:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      (startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'cursor/')) &&
      !contains(join(github.event.pull_request.labels.*.name, ','), 'needs-founder')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Hold on contracts; else squash when backend+frontend pass
        run: |
          set -euo pipefail
          FILES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')
          echo "$FILES"
          HOLD=0
          if echo "$FILES" | grep -Eq '(^|/)(docs/NEXT\.md|docs/HOW_WE_WORK\.md|docs/V10_BUILD\.md|docs/V10_CLOSE\.md|docs/contracts/|CLAUDE\.md|\.cursor/rules/|\.github/workflows/|packs/hr/hire_leaves\.yaml)'; then
            HOLD=1
          fi
          if printf '%s' "$TITLE" | grep -Eiq 'STOP-GATE|needs-founder|WorkOS|Auth0|Clerk'; then
            HOLD=1
          fi
          if [ "$HOLD" = 1 ]; then
            gh label create needs-founder --color B60205 --description "Founder must merge" -f
            gh pr edit "$PR" --add-label needs-founder
            gh pr comment "$PR" --body "Held for founder (needs-founder)."
            exit 0
          fi
          for i in $(seq 1 60); do
            CHECKS=$(gh pr checks "$PR" 2>/dev/null || true)
            echo "$CHECKS"
            BACK=$(echo "$CHECKS" | awk '/^backend/{print $2; exit}')
            FRONT=$(echo "$CHECKS" | awk '/^frontend/{print $2; exit}')
            if [ "$BACK" = pass ] && [ "$FRONT" = pass ]; then
              gh pr merge "$PR" --squash --delete-branch
              exit 0
            fi
            if [ "$BACK" = fail ] || [ "$FRONT" = fail ]; then
              echo "backend or frontend failed"
              exit 1
            fi
            sleep 10
          done
          echo "timed out waiting for backend+frontend"
          exit 1
