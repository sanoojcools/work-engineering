name: CI

# Track 2 of the enterprise-readiness roadmap ("make it safe to run"): no CI
# existed anywhere in this project's history before this workflow. Runs the
# real Postgres-backed test suite (RLS/tenant-isolation tests self-skip
# without a real Postgres, so a service container here isn't optional) plus
# the frontend typecheck/build, on every push to main and every PR.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wep
          POSTGRES_PASSWORD: wep
          POSTGRES_DB: wep
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://wep_app:wep_app_dev_pw@localhost:5433/wep
      # wep (superuser): owns the tables, runs migrations. Alembic revision
      # f198c4aadd2c creates the wep_app role above, so migrations must run
      # before anything connects as wep_app -- same order docker-compose.yml
      # already enforces for local/prod.
      SYSTEM_DATABASE_URL: postgresql+psycopg2://wep:wep@localhost:5433/wep
      # No production data ever touches CI; a fixed per-run value is fine
      # here specifically because config.py otherwise refuses to start with
      # no PII_ENCRYPTION_KEY set at all -- see that file's own comment.
      PII_ENCRYPTION_KEY: ci-test-key-not-for-real-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate HR Function Pack (packs/hr)
        # BUILD_PROGRAM.md Track 1 slice 1.4's coverage check, now on every
        # PR instead of run by hand: fails the job if any of the 18 Work
        # Unit attributes has zero interview questions mapped to it. Needs
        # no database — same reason this step runs before migrations.
        working-directory: ${{ github.workspace }}
        run: python scout pack validate packs/hr

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Confirm single head, no autogenerate drift
        run: python -m alembic check

      - name: Run tests
        run: pytest -q

      - name: Handoff invariants (V10-14)
        run: pytest -q tests/test_v10_14_invariants.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  e2e:
    # CENSUS-v0's required Playwright coverage (docs/BUILD_PROGRAM.md). Real
    # Postgres, real backend, real built-and-served frontend -- not a mocked
    # page. Runs after backend/frontend so a cheap failure there is not paid
    # for twice.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wep
          POSTGRES_PASSWORD: wep
          POSTGRES_DB: wep
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://wep_app:wep_app_dev_pw@localhost:5433/wep
      SYSTEM_DATABASE_URL: postgresql+psycopg2://wep:wep@localhost:5433/wep
      PII_ENCRYPTION_KEY: ci-test-key-not-for-real-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Start backend
        working-directory: backend
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 1
          done
          echo "--- backend.log ---"; cat /tmp/backend.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend preview
        working-directory: frontend
        run: nohup npm run preview > /tmp/frontend.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ && exit 0
            sleep 1
          done
          echo "--- frontend.log ---"; cat /tmp/frontend.log
          exit 1

      - name: Run Playwright census suite
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
