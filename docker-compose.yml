services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wep
      POSTGRES_PASSWORD: wep
      POSTGRES_DB: wep
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wep"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # wep_app: non-superuser, RLS-bound (see alembic f198c4aadd2c), and the
      # role the app serves under. The migration step in `command` below runs
      # as wep instead — wep_app does not own the tables and cannot alter them.
      # f198c4aadd2c is also what creates wep_app, so migrations must go first.
      DATABASE_URL: postgresql+psycopg2://wep_app:wep_app_dev_pw@db:5432/wep
      SYSTEM_DATABASE_URL: postgresql+psycopg2://wep:wep@db:5432/wep
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Migrate before serving. Alembic reads SYSTEM_DATABASE_URL (the wep
    # superuser that owns the tables); the app itself keeps running as
    # wep_app so RLS still binds it. Without this the container starts
    # against an empty database, because create_all() is gone.
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
